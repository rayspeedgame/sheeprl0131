# @package _global_

defaults:
  - dreamer_v3
  - override /algo: dreamer_v3_mod
  - override /env: UAVenv
  - _self_

# Experiment
seed: 5

# Environment
env:
  num_envs: 1
  id: uav

# Checkpoint
checkpoint:
  every: 10000

# Buffer
buffer:
  size: 500_000
  checkpoint: True
  memmap: True

# Algorithm
algo:
  total_steps: 500_000
  cnn_keys:
    encoder: []
  mlp_keys:
    encoder: [density_matrix]
  learning_starts: 1300
  

# Metric
metric:
  log_every: 5000
